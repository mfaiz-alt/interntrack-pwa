<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#0d6efd">

  <meta name="mobile-web-app-capable"
        content="yes">

  <meta name="apple-mobile-web-app-capable"
        content="yes">

  <meta name="apple-mobile-web-app-title"
        content="InternTrack">

  <link rel="manifest"
        href="manifest.json">

  <link rel="icon"
        type="image/png"
        href="icon-192.png">

  <link rel="apple-touch-icon"
        href="icon-192.png">

  <title>InternTrack</title>

  <style>

    body {
      margin: 0;
      background: #f8f9fa;
      font-family: Arial, sans-serif;

      display: flex;
      justify-content: center;
      align-items: center;

      min-height: 100vh;
      text-align: center;
    }

    .container {
      padding: 30px;
    }

    img {
      width: 120px;
      height: 120px;
      object-fit: contain;
      margin-bottom: 20px;
    }

    h1 {
      color: #0d6efd;
      margin-bottom: 10px;
    }

    p {
      color: #666;
    }

    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 14px 30px;

      background: #0d6efd;
      color: white;

      text-decoration: none;
      border-radius: 10px;

      font-weight: bold;
    }

  </style>

</head>

<body>

  <div class="container">

    <img src="icon-192.png"
         alt="InternTrack">

    <h1>InternTrack</h1>

    <p>Opening Attendance System...</p>

</html>
